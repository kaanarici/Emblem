name: server

on:
  push:
    paths: ["server/**", "ios/EmblemCore/Sources/EmblemCore/Blocks/Blocks.swift", ".github/workflows/server.yml"]
  pull_request:
    paths: ["server/**", "ios/EmblemCore/Sources/EmblemCore/Blocks/Blocks.swift", ".github/workflows/server.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run check
